
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    with:
      # GTBlocker ships Java 25 bytecode (enableModernJavaSyntax = modern), but the shared workflow's runServer
      # starts on Java 8 and dies on UnsupportedClassVersionError. The server test runs on Java 25 below instead.
      client-only: true
    secrets: inherit

  server-java25:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout mod repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK versions
      uses: actions/setup-java@v5
      with:
        java-version: |
          8
          25
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Compile the mod
      run: |
        chmod +x gradlew
        ./gradlew --build-cache --info --stacktrace setupCIWorkspace assemble

    # Its own Gradle run: with the workspace setup and the compile in the same run, the "stop" on stdin never reached
    # the server, which then idled until the timeout.
    - name: Run a dedicated server on Java 25 for up to 300 seconds
      shell: bash
      run: |
        mkdir -p run/server
        echo "eula=true" > run/server/eula.txt
        echo "stop" > run/stop.txt
        set +e
        timeout 300 ./gradlew --build-cache --info --stacktrace runServer25 2>&1 < run/stop.txt | tee server.log
        echo "${PIPESTATUS[0]}" > run/server-exit-code

    - name: Test no errors reported during server run
      shell: bash
      run: |
        shopt -s nullglob
        crash_reports=(run/server/crash-reports/crash*.txt)
        if [ "${#crash_reports[@]}" -gt 0 ]; then
          echo "::error::Crash report ${crash_reports[-1]##*/}"
          cat "${crash_reports[-1]}"
          exit 1
        fi
        for marker in 'Fatal errors were detected' 'incorrect state ERRORED' 'Exception stopping the server' \
          'UnsupportedClassVersionError'; do
          if grep --quiet --fixed-strings "$marker" server.log; then
            echo "::error::Server log contains: $marker"
            exit 1
          fi
        done
        if ! grep --quiet --perl-regexp 'Done \(.+\)\! For help, type "help" or "\?"' server.log; then
          echo "::error::Server did not finish startup"
          exit 1
        fi
        if ! grep --quiet --fixed-strings 'Stopping server' server.log; then
          echo "::error::Server never got the stop command"
          exit 1
        fi
        exit_code=$(cat run/server-exit-code)
        if [ "$exit_code" != 0 ]; then
          echo "::error::runServer25 exited with $exit_code (124: the server was still running at the timeout)"
          exit 1
        fi
        echo "Server started and stopped cleanly"
